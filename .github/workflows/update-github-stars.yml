name: Update GitHub stars

on:
  schedule:
    # Every Monday at 10:23 Asia/Shanghai (GitHub Actions uses UTC).
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-github-stars
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v7

      - name: Sum configured GitHub repository stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_github_stars.py

      - name: Commit an updated total
        run: |
          if git diff --quiet -- data/github.yaml; then
            echo "GitHub star total is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.yaml
          git commit -m "Update homepage GitHub star count"
          git push
