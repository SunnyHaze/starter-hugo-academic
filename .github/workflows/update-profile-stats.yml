name: Update profile statistics

on:
  schedule:
    # Every Monday at 10:23 Asia/Shanghai (GitHub Actions uses UTC).
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Read the current Scholar citation count
        id: scholar
        continue-on-error: true
        run: python scripts/update_scholar_citations.py

      - name: Sum configured GitHub repository stars
        id: github
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_github_stars.py

      - name: Commit updated statistics
        run: |
          if git diff --quiet -- data/scholar.yaml data/github.yaml; then
            echo "Profile statistics are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scholar.yaml data/github.yaml
          git commit -m "Update homepage profile statistics"
          git push

      - name: Report a complete update failure
        if: steps.scholar.outcome == 'failure' && steps.github.outcome == 'failure'
        run: |
          echo "Both profile statistic sources failed; existing values were preserved."
          exit 1
