# SITE SETUP
# Guide: https://wowchemy.com/docs/getting-started/
# Documentation: https://wowchemy.com/docs/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance

appearance:
  theme_day: minimal
  theme_night: minimal
  font: minimal
  font_size: L

# SEO

marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: ''
    description: 'Xiaochen Ma researches high-performance data infrastructure and distributed systems for scalable LLM data preparation.'
    twitter: ''
  analytics:
    # GA4 Measurement ID; manage the property at https://analytics.google.com/.
    # This public ID is injected only in production builds by Wowchemy.
    google_analytics: 'G-1MB7W3Q629'
    baidu_tongji: '29de7f6d4108d9b300a82f09c07f64a5'
    google_tag_manager: ''
    microsoft_clarity: ''
    # Public tracking ID; manage analytics at https://cloud.umami.is/.
    # Never store an Umami API key in this repository or in frontend code.
    umami:
      website_id: 'f8a2218e-fec8-46f8-92e5-1ec31ff5ecc6'
      script_url: 'https://cloud.umami.is/script.js'
      domain: 'ma.xiaochen.world'
  verification:
    google: ''
    baidu: ''

# Public analytics dashboard shown near the bottom of the homepage.
# Switch only `provider` to move between the two retained implementations.
# Umami board: https://cloud.umami.is/websites/f8a2218e-fec8-46f8-92e5-1ec31ff5ecc6
# Looker report: https://lookerstudio.google.com/reporting/2ff428f5-3128-4143-a990-923dc375355e
analytics_showcase:
  provider: umami # umami | looker
  providers:
    umami:
      embed_url: 'https://cloud.umami.is/share/L6QQJnSkovbLq4qj'
      external_url: 'https://cloud.umami.is/share/L6QQJnSkovbLq4qj'
      frame_ratio: '16 / 10'
    looker:
      # The embed URL becomes public only after sharing and embedding are enabled in Looker Studio.
      embed_url: 'https://lookerstudio.google.com/embed/reporting/2ff428f5-3128-4143-a990-923dc375355e/page/YZV6F'
      external_url: 'https://lookerstudio.google.com/reporting/2ff428f5-3128-4143-a990-923dc375355e/page/YZV6F'
      frame_ratio: '15 / 8'

# Site header

header:
  navbar:
    enable: true
    align: l
    show_logo: true
    show_language: true
    show_day_night: true
    show_search: true
    highlight_active_link: true

# Site footer

footer:
  copyright:
    notice: '© {year} Me. This work is licensed under {license}'
    license:
      enable: true
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization

locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'
  address_format: en-us

# Site features

features:
  syntax_highlighter:
    theme_light: github-light
    theme_dark: dracula
  math:
    enable: false
  privacy_pack:
    enable: false
  repository:
    url: 'https://github.com/<username>/<repository>'
    content_dir: content
    branch: main
  avatar:
    gravatar: false
    shape: circle
  comment:
    provider: ''
    disqus:
      shortname: ''
      show_count: true
    commento:
      url: ''
    giscus:
      repo: ''
      repo_id: ''
      category: ''
      category_id: ''
  search:
    provider: wowchemy
    algolia:
      app_id: ''
      api_key: ''
      index_name: ''
      show_logo: false
  map:
    provider: ''
    api_key: ''
    zoom: 15

# Extensions

extensions:
  cms:
    branch: main
    local_backend: false
  academicons:
    enable: true

# Security

security:
  # Allow frame for embedding speaker notes in slides
  allow_frame: true
