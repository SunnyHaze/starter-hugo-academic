{{- $stats := site.Data.github -}}
{{- $profile := "https://github.com/SunnyHaze" -}}
{{- $is_zh := eq site.Language.Lang "zh" -}}
<div class="impact-card impact-card-github" role="group" aria-label="{{ if $is_zh }}开源影响{{ else }}Open-source impact{{ end }}">
  <strong class="impact-label">{{ if $is_zh }}开源影响{{ else }}Open-source impact{{ end }}</strong>
  <a class="impact-source" href="{{ $profile }}" target="_blank" rel="noopener noreferrer">
    <i class="fab fa-github" aria-hidden="true"></i>
    <span>GitHub</span>
  </a>
  <span class="impact-metric">
    <strong>{{ lang.FormatNumber 0 $stats.stars }}+</strong>
    <span>{{ if $is_zh }}Stars{{ else }}stars{{ end }}</span>
  </span>
</div>
